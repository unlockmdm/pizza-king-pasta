<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#fff}
a{color:#1A1414}
a:hover{color:#D7192D}
button{font-family:inherit}
@keyframes pkmUp{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pkmFade{from{opacity:0}to{opacity:1}}
@keyframes pkmIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="font-family:'Figtree',system-ui,sans-serif;color:#1A1414;background:#fff;min-height:100vh">
  <header style="position:sticky;top:68px;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px)">
    <nav style="border-bottom:1px solid #E9E9EC">
      <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,32px);display:flex;gap:28px;overflow-x:auto;scrollbar-width:none">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="7">
          <a href="{{ n.href }}" onClick="{{ n.go }}" style="flex:none;padding:14px 0 13px;font-weight:700;font-size:15px;color:{{ n.fg }};text-decoration:none;white-space:nowrap;box-shadow:inset 0 -2.5px 0 {{ n.line }};transition:color .2s">{{ n.label }}</a>
        </sc-for>
      </div>
    </nav>
  </header>

  <main style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,32px) 96px;display:flex;flex-direction:column">
    <h1 style="margin:0;padding:clamp(36px,5vw,64px) 0 0;font-weight:900;font-size:clamp(44px,6vw,72px);line-height:1;letter-spacing:-.045em">Menu</h1>

    <section id="walkin" data-screen-label="Walk-in specials" style="padding-top:32px;scroll-margin-top:124px">
      <div style="background:#1A1414;color:#fff;border-radius:28px;padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:24px">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <h2 style="margin:0;font-weight:900;font-size:clamp(28px,3vw,36px);letter-spacing:-.035em">Walk-in specials</h2>
          <span style="height:26px;display:flex;align-items:center;padding:0 10px;border-radius:999px;background:#D7192D;font-weight:800;font-size:12px;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase">Pickup only</span>
        </div>
        <div style="display:grid;grid-template-columns:{{ walkCols }};gap:12px">
          <sc-for list="{{ walkins }}" as="d" hint-placeholder-count="4">
            <div style="background:#2A2020;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)">
              <span role="img" aria-label="{{ d.alt }}" style="position:relative;z-index:0;isolation:isolate;aspect-ratio:16/10;overflow:hidden;background:radial-gradient(110% 90% at 50% 38%,#4A3833 0%,#2E2321 58%,#211918 100%)"><sc-for list="{{ d.layers }}" as="L" hint-placeholder-count="0"><span style="position:absolute;left:{{ L.l }};top:{{ L.t }};width:{{ L.w }};z-index:{{ L.z }};transform:translate(-50%,-50%) rotate({{ L.r }});filter:{{ L.f }}"><span aria-hidden="true" style="display:block;flex:none;background-image:url('{{ L.src }}');background-position:center;background-repeat:no-repeat;width:100%;aspect-ratio:{{ L.ar }};background-size:contain"></span><sc-for list="{{ L.tops }}" as="t" hint-placeholder-count="0"><span aria-hidden="true" style="display:block;flex:none;background-image:url('{{ t.src }}');background-position:center;background-repeat:no-repeat;position:absolute;left:{{ t.x }};top:{{ t.y }};width:{{ t.w }};aspect-ratio:1/1;background-size:contain;transform:translate(-50%,-50%) rotate({{ t.r }}) scaleX({{ t.fx }});filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))"></span></sc-for></span></sc-for><span style="position:absolute;z-index:20;left:12px;bottom:12px;height:38px;padding:0 14px;border-radius:999px;background:#D7192D;color:#fff;font-weight:900;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)">{{ d.priceText }}</span></span>
              <span style="padding:18px 20px 20px;display:flex;flex-direction:column;gap:16px;flex:1">
                <span style="display:flex;flex-direction:column;gap:4px;flex:1"><span style="font-weight:800;font-size:18px">{{ d.name }}</span><span style="font-size:14px;line-height:1.45;color:#CFC6C0">{{ d.desc }}</span></span>
                <button onClick="{{ d.add }}" style="height:46px;border:0;border-radius:14px;background:#fff;color:#1A1414;font-weight:800;font-size:15px;cursor:pointer;transition:background .15s,color .15s" style-hover="background:#D7192D;color:#fff">Customize</button>
              </span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="6">
      <section id="{{ sec.id }}" data-screen-label="{{ sec.title }}" style="padding-top:72px;display:flex;flex-direction:column;gap:20px;scroll-margin-top:124px">
        <div style="display:flex;flex-direction:column;gap:12px">
          <span style="width:44px;height:6px;border-radius:3px;background:{{ sec.accent }}"></span>
          <h2 style="margin:0;font-weight:900;font-size:clamp(30px,3.4vw,42px);letter-spacing:-.04em">{{ sec.title }}</h2>
        </div>
        <sc-if value="{{ sec.isTile }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px">
            <sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="6">
              <button onClick="{{ r.act }}" style="display:flex;flex-direction:column;border:0;padding:0;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #E9E9EC;text-align:left;color:#1A1414;cursor:pointer;transition:box-shadow .3s,transform .3s" style-hover="transform:translateY(-4px);box-shadow:0 0 0 1px #DFDFE2,0 22px 44px rgba(26,20,20,.14)">
                <span style="position:relative;aspect-ratio:4/3;overflow:hidden;background:#F2F2F5"><sc-if value="{{ r.hasImg }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="display:block;flex:none;background-image:url('{{ r.img }}');background-position:center;background-repeat:no-repeat;width:100%;height:100%;background-size:cover"></span></sc-if><sc-if value="{{ r.noImg }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.32),rgba(255,255,255,0) 58%),{{ r.accent }}"><span style="font-weight:900;font-size:clamp(56px,6vw,84px);letter-spacing:-.06em;color:#fff;text-shadow:0 8px 24px rgba(0,0,0,.18)">{{ r.initial }}</span></span></sc-if><span style="position:absolute;left:12px;top:12px;display:flex;gap:6px"><sc-if value="{{ r.veg }}" hint-placeholder-val="{{ false }}"><span title="Vegetarian" style="width:15px;height:15px;border:1.5px solid #12663A;border-radius:3px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff"><span style="width:6px;height:6px;border-radius:50%;background:#12663A"></span></span></sc-if></span></span>
                <span style="display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;flex:1">
                  <span style="font-weight:800;font-size:18px;letter-spacing:-.01em">{{ r.name }}</span>
                  <span style="font-size:14px;line-height:1.45;color:#636366;flex:1">{{ r.desc }}</span>
                  <span style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px"><span style="font-weight:800;font-size:15px">{{ r.priceText }}</span><span style="height:42px;padding:0 16px;border-radius:999px;background:{{ r.btnBg }};color:{{ r.btnFg }};font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px">{{ r.cta }}</span></span>
                </span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ sec.isRow }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:{{ twoCols }};gap:12px">
            <sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="4">
              <button onClick="{{ r.act }}" style="display:flex;align-items:center;gap:16px;min-height:124px;padding:14px 18px 14px 14px;border:0;border-radius:22px;background:{{ r.cardBg }};color:{{ r.cardFg }};box-shadow:0 0 0 1px {{ r.ring }};text-align:left;cursor:pointer;transition:box-shadow .3s,transform .3s" style-hover="transform:translateY(-3px);box-shadow:0 18px 38px rgba(26,20,20,.16)">
                <span style="flex:none;width:96px;height:96px;border-radius:16px;overflow:hidden;background:{{ r.tileBg }}"><sc-if value="{{ r.hasImg }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="display:block;flex:none;background-image:url('{{ r.img }}');background-position:center;background-repeat:no-repeat;width:100%;height:100%;background-size:cover"></span></sc-if><sc-if value="{{ r.noImg }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.32),rgba(255,255,255,0) 58%),{{ r.accent }}"><span style="font-weight:900;font-size:clamp(56px,6vw,84px);letter-spacing:-.06em;color:#fff;text-shadow:0 8px 24px rgba(0,0,0,.18)">{{ r.initial }}</span></span></sc-if></span>
                <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
                  <span style="display:flex;align-items:center;gap:8px"><span style="font-weight:800;font-size:17px">{{ r.name }}</span><sc-if value="{{ r.veg }}" hint-placeholder-val="{{ false }}"><span title="Vegetarian" style="width:15px;height:15px;border:1.5px solid #12663A;border-radius:3px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff"><span style="width:6px;height:6px;border-radius:50%;background:#12663A"></span></span></sc-if></span>
                  <sc-if value="{{ r.hasDesc }}" hint-placeholder-val="{{ true }}"><span style="font-size:14px;line-height:1.45;color:{{ r.muted }}">{{ r.desc }}</span></sc-if>
                </span>
                <span style="flex:none;font-weight:800;font-size:16px">{{ r.priceText }}</span>
                <span style="flex:none;width:42px;height:42px;border-radius:50%;background:{{ r.btnBg }};color:{{ r.btnFg }};display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </section>
    </sc-for>
  </main>

  

  <sc-if value="{{ pickerOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px">
      <div onClick="{{ closePicker }}" style="position:absolute;inset:0;background:rgba(26,20,20,.45);animation:pkmFade .2s ease both"></div>
      <div role="dialog" aria-label="{{ pickerName }}" style="position:relative;width:min(420px,100%);background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:6px;box-shadow:0 24px 60px rgba(26,20,20,.25);animation:pkmIn .22s ease both">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:10px">
          <span style="display:flex;flex-direction:column;gap:3px"><span style="font-weight:900;font-size:22px;letter-spacing:-.03em">{{ pickerName }}</span><span style="font-size:14px;color:#636366">{{ pickerSub }}</span></span>
          <button onClick="{{ closePicker }}" aria-label="Close" style="width:42px;height:42px;border:0;border-radius:50%;background:#F2F2F5;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1A1414;flex:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <sc-if value="{{ pickerSpicy }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:8px;padding:2px 0 10px">
            <span style="font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#636366">Spice level</span>
            <div role="radiogroup" aria-label="Spice level" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">
              <sc-for list="{{ spiceOpts }}" as="v" hint-placeholder-count="4">
                <button role="radio" aria-checked="{{ v.on }}" onClick="{{ v.pick }}" style="display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border:0;border-radius:12px;background:{{ v.bg }};color:{{ v.fg }};font-family:inherit;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s"><span aria-hidden="true" style="display:flex;gap:3px"><sc-for list="{{ v.dots }}" as="d" hint-placeholder-count="3"><span style="width:6px;height:6px;border-radius:50%;background:{{ d.bg }}"></span></sc-for></span>{{ v.label }}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
        <sc-for list="{{ pickerOpts }}" as="o" hint-placeholder-count="3">
          <button onClick="{{ o.add }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;border:0;border-radius:14px;background:#F2F2F5;cursor:pointer;color:#1A1414;transition:background .15s" style-hover="background:#E9E9EC">
            <span style="font-weight:700;font-size:16px">{{ o.label }}</span>
            <span style="display:flex;align-items:center;gap:12px"><span style="font-weight:800;font-size:16px">{{ o.priceText }}</span><span style="width:30px;height:30px;border-radius:50%;background:#D7192D;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position:fixed;left:50%;bottom:24px;z-index:75;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#1A1414;color:#fff;border-radius:16px;padding:12px 12px 12px 18px;box-shadow:0 12px 32px rgba(26,20,20,.3);animation:pkmUp .25s ease both;max-width:calc(100vw - 32px)">
      <span style="font-weight:700;font-size:15px">{{ toast }}</span>
      <a href="Pizza King Home v2.dc.html" style="flex:none;height:36px;display:flex;align-items:center;padding:0 14px;border-radius:999px;background:#D7192D;color:#fff;font-weight:800;font-size:14px;text-decoration:none" style-hover="color:#fff;background:#B5121F">View cart</a>
    </div>
  </sc-if>

  <sc-if value="{{ builderOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="PizzaBuilder" item="{{ builderItem }}" on-close="{{ closeBuilder }}" on-add="{{ builderAdd }}" hint-size="100%,100%" style="position:fixed;inset:0;z-index:80"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CART_KEY = 'pkp-home-v2-cart';
const PIZZA_IMG = 'https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?fm=jpg&q=72&w=1000&auto=format&fit=crop';
const UI = id => 'https://images.unsplash.com/photo-' + id + '?fm=jpg&q=70&w=600&auto=format&fit=crop';
const PIZZA_PICS = ['1593560708920-61dd98c46a4e', '1655673654158-9f7285b7d1ea', '1604382354936-07c5d9983bd3', '1590947132387-155cc02f3212', '1692737580547-b45bb4a02356', '1565299624946-b28f40a0ae38', '1611915365928-565c527a0590', '1594007654729-407eedc4be65'].map(UI);
const PIZZA_PHOTO = { napoli: '1571066811602-716837d681de', 'four-seasons': '1559978137-8c560d91e9e1', 'italian-veg': '1617470702892-e01504297e84', 'non-veg': '1600628421055-4d30de868b8f', bismark: '1595708684082-a173bb3a06c5', 'sea-food': '1552539618-7eec9b4d1796', 'chicken-shawarma': '1565299624946-b28f40a0ae38', 'butter-chicken': 'assets/pizzas/butter-chicken.png', 'shahi-paneer': 'assets/pizzas/shahi-paneer.png', greek: '1573821663912-6df460f9c684', hawaiian: '1576458088443-04a19bb13da6', 'meat-lover': '1628840042765-356cda07504e', canadian: '1534308983496-4fabb1a015ee', 'tandoori-fish': '1589187151053-5ec8818e661b' };
const ROW_PIC = { 'fruit-juice': 'https://images.unsplash.com/photo-1600271886742-f049cd451bba?fm=jpg&q=70&w=600&auto=format&fit=crop', 'espresso': 'https://images.unsplash.com/photo-1485808191679-5f86510681a2?fm=jpg&q=70&w=600&auto=format&fit=crop', 'hot': 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?fm=jpg&q=70&w=600&auto=format&fit=crop', 'beer': 'https://images.unsplash.com/photo-1608270586620-248524c67de9?fm=jpg&q=70&w=600&auto=format&fit=crop', 'shake': 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?fm=jpg&q=70&w=600&auto=format&fit=crop', 'momos': 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?fm=jpg&q=70&w=600&auto=format&fit=crop', 'chaat': 'https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?fm=jpg&q=70&w=600&auto=format&fit=crop', 'sub': 'https://images.unsplash.com/photo-1509722747041-616f39b57569?fm=jpg&q=70&w=600&auto=format&fit=crop', 'nv-salad': 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?fm=jpg&q=70&w=600&auto=format&fit=crop', 'v-salad': 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?fm=jpg&q=70&w=600&auto=format&fit=crop', 'wedges': 'https://images.unsplash.com/photo-1623238913973-21e45cced554?fm=jpg&q=70&w=600&auto=format&fit=crop', 'leg': 'https://images.unsplash.com/photo-1617692855027-33b14f061079?fm=jpg&q=70&w=600&auto=format&fit=crop', 'dip-garlic': 'assets/dips/menu-garlic.png', 'dip-ranch': 'assets/dips/menu-ranch.png', 'dip-chipotle': 'assets/dips/menu-chipotle.png', 'dip-jalapeno': 'assets/dips/menu-jalapeno-cheddar.png', 'dip-marinara': 'assets/dips/menu-marinara.png', wings: 'assets/ingredients/tandoori-chicken.png', 'pasta-rose': 'assets/menu/pasta-rose.png', 'pasta-alfredo': 'assets/menu/pasta-alfredo.png', 'veg-pasta-rose': 'assets/menu/pasta-rose.png', 'veg-pasta-alfredo': 'assets/menu/pasta-alfredo.png', 'ch-pasta-rose': 'assets/menu/pasta-rose.png', 'ch-pasta-alfredo': 'assets/menu/pasta-alfredo.png', 'veg-pasta-tomato': 'assets/menu/pasta.jpg', 'ch-pasta-tomato': 'assets/menu/pasta.jpg', cone: 'assets/menu/gelato.jpg', scoop: 'assets/menu/gelato.jpg', lassi: 'assets/menu/juice.jpg', corn: 'assets/ingredients/corn.jpg' };
const THEME = {
  pizzas: { accent: '#D7192D', btnBg: '#D7192D', btnFg: '#fff' },
  tandoori: { accent: '#C2511F', cardBg: '#1A1414', cardFg: '#fff', muted: '#CFC6C0', ring: 'transparent', tileBg: '#2A2020', btnBg: '#D7192D', btnFg: '#fff' },
  sides: { accent: '#6E8B3D', cardBg: '#F1F4E8', cardFg: '#1A1414', muted: '#5A6150', ring: 'transparent', tileBg: '#E3E9D3', btnBg: '#1A1414', btnFg: '#fff' },
  dips: { accent: '#D7192D', cardBg: '#F5F5F7', cardFg: '#1A1414', muted: '#646467', ring: 'transparent', tileBg: '#EDEDF0', btnBg: '#1A1414', btnFg: '#fff' },
  pasta: { accent: '#E0A526', cardBg: '#EEEEF1', cardFg: '#1A1414', muted: '#6E5E45', ring: 'transparent', tileBg: '#F3E3BF', btnBg: '#1A1414', btnFg: '#fff' },
  gelato: { accent: '#E46A92', cardBg: '#FCE9EE', cardFg: '#1A1414', muted: '#7A5560', ring: 'transparent', tileBg: '#F7D3DE', btnBg: '#C2335F', btnFg: '#fff' },
  drinks: { accent: '#1E6E6A', cardBg: '#E5F2EF', cardFg: '#1A1414', muted: '#4B6560', ring: 'transparent', tileBg: '#CFE6E1', btnBg: '#1E6E6A', btnFg: '#fff' },
};
const money = n => '$' + n.toFixed(2);
const PZ = n => 'assets/toppings/pz/' + n + '.png';
const RECIPES = {
  pep: [[['pep-0', 'pep-1'], 14, 11]],
  veg: [[['mushroom-0', 'mushroom-1'], 16, 5], [['gp-0', 'gp-1', 'gp-2', 'gp-3'], 16, 5], [['onion-0', 'onion-1'], 15, 4], [['bol-0'], 8.5, 6]],
  meat: [[['pep-0', 'pep-1'], 14, 6], [['bacon-0'], 17, 3], [['isaus-0'], 11, 5], [['gp-0', 'gp-2'], 15, 3]],
  tand: [[['tand-0', 'tand-1'], 15, 5], [['rp-0', 'rp-1'], 15, 4], [['onion-0', 'onion-1'], 15, 4], [['jal-0'], 9.5, 4]],
};
const scatter = (recipe, seed) => {
